[package]
name = "test-capsule"
version = "0.0.0"
description = "Phase 1 JS/TS SDK vertical-slice test capsule."
authors = ["Joshua J. Bouw <dev@joshuajbouw.com>"]
astrid-version = ">=0.5.0"

[[component]]
id = "test-capsule"
file = "test-capsule.wasm"
type = "executable"

[capabilities]
kv = ["*"]

[publish]
"tool.v1.execute.*" = { wit = "opaque" }
"test.v1.event.*" = { wit = "opaque" }
"hook.v1.response.before_tool_call.*" = { wit = "@unicity-astrid/wit/hook/hook-result" }

[subscribe]
"test.v1.event" = { wit = "opaque", handler = "test.v1.event" }
"hook.v1.event.before_tool_call" = { wit = "@unicity-astrid/wit/hook/hook-event-request", handler = "before_tool_call" }
